atus code indicates that the request to update the database is completed?</p>","questionText":"Which HTTP response status code indicates that the request to update the database is completed?","choices":["400","403","200","201","404","401"],"correct":[3],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":124},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":75,"questionHtml":"<p>A web service uses a rate limit algorithm that puts all incoming REST API requests into a queue in the order in which they arrive. The algorithm allows incoming requests to arrive at any rate, but the server processes the requests from the queue at a fixed rate. Which rate limit algorithm is used by the web service?</p>","questionText":"A web service uses a rate limit algorithm that puts all incoming REST API requests into a queue in the order in which they arrive. The algorithm allows incoming requests to arrive at any rate, but the server processes the requests from the queue at a fixed rate. Which rate limit algorithm is used by the web service?","choices":["token bucket","sliding window counter","fixed window counter","leaky bucket"],"correct":[3],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":125},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":76,"questionHtml":"<p>What is REST?</p>","questionText":"What is REST?","choices":["It is a protocol that allows administrators to manage nodes on an IP network.","It is a way to store and interchange data in a structured format.","It is a human readable data structure that is used by applications for storing, transforming, and reading data.","It is an architecture style for designing web service applications."],"correct":[3],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":126},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":77,"questionHtml":"<p>In the REST API request URI example http://example.com/update/person?id=42&amp;email=person%40example.com , which term describes the component example.com ?</p>","questionText":"In the REST API request URI example http://example.com/update/person?id=42&email=person%40example.com , which term describes the component example.com ?","choices":["scheme","authority","query","path"],"correct":[1],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":127},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":78,"questionHtml":"<p>As part of creating an API request using Python, the following commands are entered. What is the purpose of this step? ipaddr \\= 10.1.50.1 interface \\= Ethernet1/1 hostname \\= R1</p>","questionText":"As part of creating an API request using Python, the following commands are entered. What is the purpose of this step?\nipaddr \\= 10.1.50.1  \ninterface \\= Ethernet1/1  \nhostname \\= R1","choices":["to request JSON data","to create functions to test the code","to import Python modules","to create variables"],"correct":[3],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":128},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":79,"questionHtml":"<p>What is the meaning of the term flow as it relates to the OAuth 2.0 authorization framework?</p>","questionText":"What is the meaning of the term flow as it relates to the OAuth 2.0 authorization framework?","choices":["It is the sequence of data exchanged between a REST API request and a response.","It is a process for an API request to send authentication credentials to a web service.","It is a process for an API user to obtain an access token from the authorization server.","It is the number of requests contained in the token bucket."],"correct":[2],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":129}];
const MODULE_3_4_QUESTIONS=[{"module":"Module 3","section":"3.7.2 Software Development and Design Quiz","source":"mod 3.1.pdf","sourceNumber":2,"questionText":"Which SDLC development methodology employs many quick iterations known as sprints?","choices":["Extreme Programming","Waterfall","Lean","Agile"],"correct":[3],"questionHtml":"<p><strong>Which SDLC development methodology employs many quick iterations known as sprints?</strong></p>","explanation":"<p>In the agile software development model the SDLC process is conducted in many quick iterations called sprints.</p>","id":130},{"module":"Module 3","section":"3.7.2 Software Development and Design Quiz","source":"mod 3.1.pdf","sourceNumber":9,"questionText":"What is the role of the controller component in the Model-View-Controller (MVC) flow?","choices":["It accepts selected data and displays it to the user.","It provides visual representations and presentations of the data.","It takes user input and manipulates it to the proper format for the model.","It takes in user input and manipulates it to fit the format for the model or view."],"correct":[2],"questionHtml":"<p><strong>What is the role of the controller component in the Model-View-Controller (MVC) flow?</strong></p>","explanation":"<p>The Model-View-Controller (MVC) design pattern abstracts code and responsibility into three distinct components: model, view, and controller. The controller accepts the input, manipulates the data, and sends the manipulated data to the model.</p>","id":131},{"module":"Module 3","section":"3.7.2 Software Development and Design Quiz","source":"mod 3.1.pdf","sourceNumber":10,"questionText":"Which code review method involves the developer going through the code line-by-line with the reviewer, allowing the developer to make changes on the spot?","choices":["email pass-around","formal","change-based","over-the-shoulder"],"correct":[3],"questionHtml":"<p><strong>Which code review method involves the developer going through the code line-by-line with the reviewer, allowing the developer to make changes on the spot?</strong></p>","explanation":"<p>In an over-the-shoulder code review the developer who wrote the code goes through the code changes line by line with a reviewer who provides feedback. In this type of review the code can be changed on the spot so that the reviewer can re-review it on the spot.</p>","id":132},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":1,"questionText":"A developer issues the Linux command pip3 freeze in an activated Python 3 virtual environment. What is the function that is provided by the command?","choices":["to output a list of installed Python packages","to lock the current virtual environment","to prepare the environment before installing a Python package","to deactivate the current virtual environment"],"correct":[0],"questionHtml":"<p><strong>A developer issues the Linux command pip3 freeze in an activated Python 3 virtual environment. What is the function that is provided by the command?</strong></p>","explanation":"<p>The pip3 freeze Linux command is used to output a list of Python 3 packages installed in the current working environment.</p>","id":133},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":2,"questionText":"What are two characteristics of the Git version control system? (Choose two.)","choices":["It is a local vcs.","It is a centralized VCS.","It is a distributed VCS.","It is Microsoft proprietary.","It is Cisco proprietary.","It is open source"],"correct":[2,5],"questionHtml":"<p><strong>What are two characteristics of the Git version control system? (Choose two.)</strong></p>","explanation":"<p>Git is available for MacOS, Windows, and Linux/Unix. It is an open source implementation of a distributed version control system.</p>","id":134},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":3,"questionText":"Match the Lean term with a description.","choices":[],"correct":[],"type":"matching","pairs":[{"left":"story","right":"a simple statement of what a user needs and why"},{"left":"Scrum team","right":"uses standup meetings to review progress"},{"left":"sprint","right":"a time-boxed period where working software is developed"},{"left":"backlog","right":"a prioritized list of all the features for the software being developed"}],"questionHtml":"<p><strong>Match the Lean term with a description.</strong></p>","explanation":"<p>Correct matches: story - a simple statement of what a user needs and why; Scrum team - uses standup meetings to review progress; sprint - a time-boxed period where working software is developed; backlog - a prioritized list of all the features for the software being developed.</p>","id":135},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":4,"questionText":"What characteristic describes a formal code review?","choices":["Code is automatically sent for review by source code management systems once it is checked in.","The entire code base is reviewed in a series of meetings.","It utilizes a peer code review tool to identify code that needs retesting.","It provides direct interaction between the review team and the code author."],"correct":[1],"questionHtml":"<p><strong>What characteristic describes a formal code review?</strong></p>","explanation":"<p>In a formal code review developers have a series of meetings to review the whole code base and go over the code line by line, discussing each one in detail. The formal code review process promotes discussion between all of the reviewers.</p>","id":136},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":6,"questionText":"When a unified diff file is being reviewed, which symbol is used to indicate that a line has been added? ___ LEARN MORE","choices":["/dev/null","@@","+"],"correct":[2],"questionHtml":"<p><strong>When a unified diff file is being reviewed, which symbol is used to indicate that a line has been added? ___ LEARN MORE</strong></p>","explanation":"<p>Correct answer: +.</p>","id":137},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":7,"questionText":"What special characters are used to enclose JSON objects?","choices":["forward slash /","square brackets []","curly braces {}","parenthesis ()"],"correct":[2],"questionHtml":"<p><strong>What special characters are used to enclose JSON objects?</strong></p>","explanation":"<p>Individual objects in JSON comprise key/value pairs. These individual pairs may be surrounded by braces. JSON objects may also contain multiple key/value pairs that are separated by commas, in which case the entire object is enclosed in braces.</p>","id":138},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":8,"questionText":"What are two features of the formal code review? (Choose two.)","choices":["For a quicker turnaround, it involves only one reviewer","It involves the developer going through code with the reviewer line-by-line.","It promotes discussion among all of the reviewers.","It allows the developer to make changes on the spot.","It involves a review of the entire code base in a series of meetings."],"correct":[2,4],"questionHtml":"<p><strong>What are two features of the formal code review? (Choose two.)</strong></p>","explanation":"<p>In a formal code review, developers have a series of meetings to review the whole codebase and go over the code line by line, discussing each one in detail. The formal code review process promotes discussion among all of the reviewers.</p>","id":139},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":9,"questionText":"Which statement describes the Waterfall methodology of software development?","choices":["Process tasks are broken up into time-boxed iterations called sprints.","Each step in the process must be completed before the next step starts","It emphasizes elimination of wasted effort and maximizes customer value.","Multiple steps in the process are started simultaneously."],"correct":[1],"questionHtml":"<p><strong>Which statement describes the Waterfall methodology of software development?</strong></p>","explanation":"<p>The Waterfall model is the earliest SDLC approach. The phases follow a linear sequential flow, where each phase begins only when the previous phase is complete.</p>","id":140},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":10,"questionText":"What is clean code?","choices":["code that has no reviewer comments","code that has passed functional testing","code that is easy to read and understand","code that performs a discrete task"],"correct":[2],"questionHtml":"<p><strong>What is clean code?</strong></p>","explanation":"<p>Clean code is code that meets common principles that make it easy to read and understand. Some of these principles are as follows: Neat formatting to generally-accepted practices Code intuitive variables and objects Documented with appropriate comments Written so that it can be reused and easily unit-tested</p>","id":141},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":11,"questionText":"Match the Git command with its function.","choices":[],"correct":[],"type":"matching","pairs":[{"left":"git pull","right":"updates the local copy of the Git repository with the content of the remote Git repository"},{"left":"git init","right":"creates an empty Git repository or makes an existing folder a Git repository"},{"left":"git push","right":"updates the remote Git repository with the content changes from the local Git repository"}],"questionHtml":"<p><strong>Match the Git command with its function.</strong></p>","explanation":"<p>Correct matches: git pull - updates the local copy of the Git repository with the content of the remote Git repository; git init - creates an empty Git repository or makes an existing folder a Git repository; git push - updates the remote Git repository with the content changes from the local Git repository.</p>","id":142},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":12,"questionText":"What is the role of the view component in the Model- View-Controller (MVC) flow?","choices":["It accepts selected data and displays the visual representation to the user.","It accepts the input and applies the required rules to format the data.","It requests user input and manipulates it to fit the format for the model.","It manages the data, logic and rules of the application."],"correct":[0],"questionHtml":"<p><strong>What is the role of the view component in the Model- View-Controller (MVC) flow?</strong></p>","explanation":"<p>The Model-View-Controller (MVC) design pattern abstracts code and responsibility into three distinct components: model, view, and controller. The controller accepts the input, manipulates the data, and sends the manipulated data to the model. The view is the visual representation of the data. There can be multiple representations of the same data.</p>","id":143},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":13,"questionText":"A developer is constructing some functions in Python. When is a function referred to as a module in Python?","choices":["when the function is declared during the execution of a Python program","when the function is initiated during the execution of a Python program","when the function is packaged in a single Python file","when the function is used for the first time"],"correct":[2],"questionHtml":"<p><strong>A developer is constructing some functions in Python. When is a function referred to as a module in Python?</strong></p>","explanation":"<p>Modules are a way to build independent and self-contained blocks of code that can be reused. A module consists of a set of functions and typically contains an interface that allows for integration with other modules. A module, in Python, is a Python file with packaged functions.</p>","id":144},{"module":"Module 3","section":"Module 3 Exam","source":"mod 3.pdf","sourceNumber":15,"questionText":"A developer issues a Linux command python3 -m venv devenv . What is the developer trying to achieve?","choices":["to activate the Python 3 virtual environment named devenv","to enter the Python 3 virtual environment named veny using the devnet tool sets","to install the devnet tool sets in the Python 3 virtual environment named veny","to create a Python 3 virtual environment named devenv"],"correct":[3],"questionHtml":"<p><strong>A developer issues a Linux command python3 -m venv devenv . What is the developer trying to achieve?</strong></p>","explanation":"<p>The syntax for creating a Python 3 virtual environment in a Linux system is python3 -m venv virtual_environment , where venv is the Python 3 module to create a virtual environment and -m is the switch to tell Python 3 the venv module is to be used.</p>","id":145},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":1,"questionText":"What is JSON?","choices":["It is a data format for storing and transporting data.","It is a scripting language.","It is a database.","It is a compiled programming language."],"correct":[0],"questionHtml":"<p><strong>What is JSON?</strong></p>","explanation":"<p>Topic 14.2.5 JavaScript Object Notation (JSON) is a data format used by applications to store and transport data.</p>","id":146},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":3,"questionText":"In the RESTful API request example, http://ww w.mapquestapi.com/directions/v2/route? outFormat=json&key=KEY&from=San+Jose,Ca&to=Monterey,Ca which term describes the component directions/v2/ route ?","choices":["parameters","resources","API server","query"],"correct":[1],"questionHtml":"<p><strong>In the RESTful API request example, http://ww w.mapquestapi.com/directions/v2/route? outFormat=json&amp;key=KEY&amp;from=San+Jose,Ca&amp;to=Monterey,Ca which term describes the component directions/v2/ route ?</strong></p>","explanation":"<p>Topic 14.4.5 In this sample API request, the different components are as follows: - API Server – the MapQuest API server, http://ww w.mapquestapi.com - Resources - the MapQuest directions API, directions/v2/ route - Query - the data format and information the client is requesting from the API service, include these: • Format – format JSON is requested • Key – authentication key, here it is KEY • Parameters - information pertaining to the request, in this example, \\&quot;from=San+Jose,Ca\\&quot; and \\&quot;to=Monterey,Ca\\&quot;</p>","id":147},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":4,"questionText":"Which statement describes an API?","choices":["It is a set of functions and procedures that allows a client application to access the data of the service application.","It is a programming language for creating a web-based application.","It is a set of functions and subroutines to be used in a comprehensive application.","It is a set of rules that filter network traffic for web-based applications."],"correct":[0],"questionHtml":"<p><strong>Which statement describes an API?</strong></p>","explanation":"<p>Topic 14.3.2 An application programming interface (API) is a set of functions and procedures to allow communication among applications. Typically, a service application provides the API to allow client applications to access the data of the service application.</p>","id":148},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":5,"questionText":"Which term describes the process of managing configuration changes of network devices in an orderly fashion?","choices":["orchestration","version control","provisioning","automation"],"correct":[0],"questionHtml":"<p><strong>Which term describes the process of managing configuration changes of network devices in an orderly fashion?</strong></p>","explanation":"<p>Topic 14.5.4 Configuration management tools typically include automation and orchestration. Automation is automatically performing a task on a system. Arranging the automated tasks into a coordinated process or workflow is called orchestration.</p>","id":149},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":6,"questionText":"Which web service API can use multiple data formats including JSON, XML, and YAML?","choices":["JSON-RPC","REST","SOAP","XML-RPC"],"correct":[1],"questionHtml":"<p><strong>Which web service API can use multiple data formats including JSON, XML, and YAML?</strong></p>","explanation":"<p>Topic 14.3.5 REST API can use multiple data formats including JSON, XML, YAML, and others. Both SOAP and XML-RPC use XML format. JSON-RPC uses JSON format.</p>","id":150},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":7,"questionText":"What are two reasons that most RESTful APIs require a key in the request? (Choose two.)","choices":["to authenticate the requesting source","to gather information on the people using the API","to encrypt the query message in the API request","to make sure that the query matches the service offered by the web application","to specify the data format expected from the response"],"correct":[0,1],"questionHtml":"<p><strong>What are two reasons that most RESTful APIs require a key in the request? (Choose two.)</strong></p>","explanation":"<p>Topic 14.4.5 Many RESTful APIs, including public APIs, require a key. The reasons an API provider may require a key include the following: • to authenticate the source to make sure it is authorized to use the API • to limit the number of people using the API • to better capture and track the data being requested by users • to gather information on the people using the API</p>","id":151},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":8,"questionText":"What is a difference between the XML and HTML data formats?","choices":["XML uses a self-descriptive data structure but HTML uses a standard document structure.","XML formats data in hexadecimal whereas HTML formats data in binary.","XML requires indentation for each key/value pair whereas HTML does not require indentation.","XML encloses data within a pair of tags whereas HTML uses a pair of quotation marks to enclose data."],"correct":[0],"questionHtml":"<p><strong>What is a difference between the XML and HTML data formats?</strong></p>","explanation":"<p>Topic 14.2.8 XML is a human readable data structure used to store, transfer, and read data by applications. Like HTML, XML uses a related set of tags to enclose data. However, unlike HTML, XML does not use predefined tags or a standard document structure, but rather it uses self-descriptive tags and structure.</p>","id":152},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":9,"questionText":"A programmer is using Ansible as the configuration management tool. Which term is used to describe a set of instructions for execution?","choices":["Pillar","Manifest","Cookbook","Playbook"],"correct":[3],"questionHtml":"<p><strong>A programmer is using Ansible as the configuration management tool. Which term is used to describe a set of instructions for execution?</strong></p>","explanation":"<p>Topic 14.5.5 Ansible uses the name Playbook to describe the set of instructions to be executed.</p>","id":153},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":10,"questionText":"Which term is used to describe a set of instructions for execution by the configuration management tool Chef?","choices":["Playbook","Pillar","Cookbook","Manifest"],"correct":[2],"questionHtml":"<p><strong>Which term is used to describe a set of instructions for execution by the configuration management tool Chef?</strong></p>","explanation":"<p>Topic 14.5.5 The configuration management tool Chef uses the name Cookbook to describe the set of instructions to be executed.</p>","id":154},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":11,"questionText":"Which two configuration management tools are developed using Python? (Choose two.)","choices":["Chef","Ansible","SaltStack","Puppet","NETCONF"],"correct":[1,2],"questionHtml":"<p><strong>Which two configuration management tools are developed using Python? (Choose two.)</strong></p>","explanation":"<p>Topic 14.5.5 Ansible and SaltStack are configuration management tools developed using Python. Chef and Puppet are configuration management tools developed using Ruby. Ruby is typically considered a more difficult language to learn than Python. NETCONF is a network management protocol.</p>","id":155},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":12,"questionText":"Which function of the Cisco intent-based networking system (IBNS) enables network operators to express the expected networking behavior that will best support the business intent?","choices":["translation","ACL analysis","activation","assurance"],"correct":[0],"questionHtml":"<p><strong>Which function of the Cisco intent-based networking system (IBNS) enables network operators to express the expected networking behavior that will best support the business intent?</strong></p>","explanation":"<p>Topic 14.6.2 The translation feature of Cisco IBNS enables network operators to express the expected network behavior that will best support the business intent.</p>","id":156},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":13,"questionText":"Which types of APIs are suitable for the data communication between a travel website and a hotel chain inquiring about room availability data?","choices":["public APIs","partner APIs","open APIs","internal APIs"],"correct":[1],"questionHtml":"<p><strong>Which types of APIs are suitable for the data communication between a travel website and a hotel chain inquiring about room availability data?</strong></p>","explanation":"<p>Topic 14.3.4 Application APIs are categorized as follows: • Open APIs or Public APIs - publicly available and can be used with no restrictions • Internal or Private APIs - used by an organization or company to access data and services for internal use only • Partner APIs - used between a company and its business partners or contractors to facilitate business between them</p>","id":157},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":14,"questionText":"Which characters are used to enclose a JSON key?","choices":["commas","square brackets","colons","quotation marks"],"correct":[3],"questionHtml":"<p><strong>Which characters are used to enclose a JSON key?</strong></p>","explanation":"<p>Topic 14.2.6 JSON keys are on the left side of the colon. They need to be wrapped in double quotation marks, as in &quot;key&quot;, and can be any valid string.</p>","id":158},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":15,"questionText":"Which character is used to separate JSON key/value pairs?","choices":["(semi colon) ;","(dash) -","(comma) ,","(forward slash) /"],"correct":[2],"questionHtml":"<p><strong>Which character is used to separate JSON key/value pairs?</strong></p>","explanation":"<p>Topic 14.2.6 Each key/value pair in a series of key/value pairs is separated by a comma, so the middle of a JSON looks like this &quot;key&quot;: &quot;value&quot;, &quot;key&quot;: &quot;value&quot;.</p>","id":159},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":16,"questionText":"In the following example, which data format is used? message: success timestamp: 1560789260 iss_position: latitude: '25.9990' longitude: '-132.6992'","choices":["HTML","JSON","XML","YAML"],"correct":[3],"questionHtml":"<p><strong>In the following example, which data format is used? message: success timestamp: 1560789260 iss_position: latitude: &#x27;25.9990&#x27; longitude: &#x27;-132.6992&#x27;</strong></p>","explanation":"<p>Topic 14.2.7 YAML Ain’t Markup Language (YAML) separates the key/ value pairs using a colon without quotation marks. YAML also uses indentation to define the structure, without using brackets or commas. JavaScript Object Notation (JSON) encloses key/value pairs in braces, { }. Keys must be strings within double quotation marks, “ ”. A key is separated from a value by a colon. Extensible Markup Language (XML) data is enclosed within a related set of tags: &lt;tag&gt;data&lt;/tag&gt;.</p>","id":160},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":17,"questionText":"In the following example, which data format is used? { \"message\": \"success\", \"timestamp\": 1560789260, \"iss_position\": { \"latitude\": \"25.9990\", \"longitude\": \"-132.6992\" } }","choices":["HTML","JSON","XML","YAML"],"correct":[1],"questionHtml":"<p><strong>In the following example, which data format is used? { &quot;message&quot;: &quot;success&quot;, &quot;timestamp&quot;: 1560789260, &quot;iss_position&quot;: { &quot;latitude&quot;: &quot;25.9990&quot;, &quot;longitude&quot;: &quot;-132.6992&quot; } }</strong></p>","explanation":"<p>Topic 14.2.6 JavaScript Object Notation (JSON) encloses key/value pairs in braces, { }. Keys must be strings within double quotation marks, “ ”. A key is separated from a value by a colon. YAML Ain’t Markup Language (YAML) separates the key/value pairs using a colon without quotation marks. YAML also uses indentation to define the structure, without using brackets or commas. Extensible Markup Language (XML) data is enclosed within a related set of tags: &lt;tag&gt;data&lt;/tag&gt;.</p>","id":161},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":18,"questionText":"A RESTful API (for example, a public API) mat require a key. What is the function of the key?","choices":["It is the top-level object of the API query.","It is used in the encryption of the message by an API request.","It is used to authenticate the requesting source.","It represents the main query components in the API request."],"correct":[2],"questionHtml":"<p><strong>A RESTful API (for example, a public API) mat require a key. What is the function of the key?</strong></p>","explanation":"<p>Topic 14.4.5 A RESTful API, including a public API, may require a key. The key is used to identify the source of the request through authentication.</p>","id":162},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":19,"questionText":"Which configuration management tool combines a set of instructions in a manifest?","choices":["Ansible","Chef","Puppet","RESTCONF","SaltStack"],"correct":[2],"questionHtml":"<p><strong>Which configuration management tool combines a set of instructions in a manifest?</strong></p>","explanation":"<p>Topic 14.5.5 Puppet is an agent-based configuration management tool built on Ruby that allows you to create a set of instructions called a manifest. Ansible is an agentless configuration management tool built on Python that allows you to create a set of instructions called a playbook. Chef is an agent-based configuration management tool built on Ruby that allows you to create a set of instructions called a cookbook. SaltStack is an agentless configuration management tool built on Python that allows you to create a set of instructions called a pillar.</p>","id":163},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":20,"questionText":"Which RESTful operation corresponds to the HTTP POST method?","choices":["create","delete","read","update"],"correct":[0],"questionHtml":"<p><strong>Which RESTful operation corresponds to the HTTP POST method?</strong></p>","explanation":"<p>Topic 14.4.3 The HTTP operation POST corresponds to the RESTful operation create, GET to read, PUT/PATCH to update, and DELETE to delete.</p>","id":164},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":21,"questionText":"How does the YAML data format structure differ from JSON?","choices":["YAML uses brackets and commas.","YAML uses end tags.","YAML uses hierarchical levels of nesting.","YAML uses indentations."],"correct":[3],"questionHtml":"<p><strong>How does the YAML data format structure differ from JSON?</strong></p>","explanation":"<p>Topic 14.2.7 YAML Ain’t Markup Language (YAML) separates the key/ value pairs using a colon without quotation marks. YAML also uses indentation to define its structure, without using brackets or commas. Extensible Markup Language (XML) data is enclosed within a related set of tags: &lt;tag&gt;data&lt;/tag&gt;. JavaScript Object Notation (JSON) encloses key/value pairs in braces, { }. Keys must be strings within double quotation marks, “ ”. A key is separated from a value by a colon.</p>","id":165},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":22,"questionText":"Which configuration management tool combines a set of instructions in a playbook?","choices":["Ansible","Chef","Puppet","RESTCONF","SaltStack"],"correct":[0],"questionHtml":"<p><strong>Which configuration management tool combines a set of instructions in a playbook?</strong></p>","explanation":"<p>Topic 14.5.5 Ansible is an agentless configuration management tool built on Python that allows you to create a set of instructions called a playbook. Chef is an agent-based configuration management tool built on Ruby that allows you to create a set of instructions called a cookbook. Puppet is an agent-based configuration management tool built on Ruby that allows you to create a set of instructions called a manifest. SaltStack is an agentless configuration management tool built on Python that allows you to create a set of instructions called a pillar.</p>","id":166},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":23,"questionText":"In the following example, which data format is used? <root> <message>success</message> <timestamp>1560789260</timestamp> <iss_position> <latitude>25.9990</latitude> <longitude>-132.6992</longitude> </iss_position> </root>","choices":["HTML","JSON","XML","YAML"],"correct":[2],"questionHtml":"<p><strong>In the following example, which data format is used? &lt;root&gt; &lt;message&gt;success&lt;/message&gt; &lt;timestamp&gt;1560789260&lt;/timestamp&gt; &lt;iss_position&gt; &lt;latitude&gt;25.9990&lt;/latitude&gt; &lt;longitude&gt;-132.6992&lt;/longitude&gt; &lt;/iss_position&gt; &lt;/root&gt;</strong></p>","explanation":"<p>Topic 14.2.8 Extensible Markup Language (XML) data is enclosed within a related set of tags: &lt;tag&gt;data&lt;/tag&gt;. JavaScript Object Notation (JSON) encloses key/value pairs in braces, { }. Keys must be strings within double quotation marks, “ ”. A key is from a value by a colon. YAML Ain’t Markup Language (YAML) separates the key/value pairs using a colon without quotation marks. YAML also uses indentation to define its structure without using brackets or commas.</p>","id":167},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":24,"questionText":"What is a difference between the HTML and XML data formats?","choices":["HTML formats data in plaintext, whereas XML formats data in binary.","HTML uses predefined tags, and XML does not.","HTML requires indentation for each key/value pair, but XML does not.","HTML uses a pair of quotation marks to enclose data, whereas XML encloses data within a pair of tags."],"correct":[1],"questionHtml":"<p><strong>What is a difference between the HTML and XML data formats?</strong></p>","explanation":"<p>Topic 14.2.8 Like XML, HTML uses a related set of tags to enclose data. However, HTML uses predefined tags, whereas XML does not. XML is a human-readable data structure that applications use to store, transfer, and read data.</p>","id":168},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":26,"questionText":"Which RESTful operation corresponds to the HTTP PUT method?","choices":["create","delete","read","update"],"correct":[3],"questionHtml":"<p><strong>Which RESTful operation corresponds to the HTTP PUT method?</strong></p>","explanation":"<p>Topic 14.4.3 The HTTP operation PUT corresponds to the RESTful operation update, POST to create, GET to read, and DELETE to delete.</p>","id":169},{"module":"Module 4","section":"14.7.2 Network Automation Quiz","source":"mod 4.1.pdf","sourceNumber":28,"questionText":"Which scenario describes the use of a public API?","choices":["It can be used with no restrictions.","It is used only within an organization.","It requires a license.","It is used between a company and its business partners."],"correct":[0],"questionHtml":"<p><strong>Which scenario describes the use of a public API?</strong></p>","explanation":"<p>Topic 14.3.4 ublic, or open, APIs have no restrictions and are available to the public. Some API providers do require a user to obtain a free key or token prior to using the API in order to control the volume of API requests received and processed.</p>","id":170},{"module":"Module 4","section":"4.9.3 Understanding and Using APIs Quiz","source":"mod 4.2.pdf","sourceNumber":5,"questionText":"Which type of encoding is used in basic authentication for REST APIs?","choices":["Base64","UTF-16","Base32","UTF-8"],"correct":[0],"questionHtml":"<p><strong>Which type of encoding is used in basic authentication for REST APIs?</strong></p>","explanation":"<p>REST APIs use Base64 encoding for the basic authentication. Base64 is a binary-to-text encoding scheme.</p>","id":171},{"module":"Module 4","section":"4.9.3 Understanding and Using APIs Quiz","source":"mod 4.2.pdf","sourceNumber":7,"questionText":"What is a reason that a network engineer would use APIs?","choices":["to automate configuration or data collection tasks","to provide a more robust security architecture","to facilitate features across network devices that operate at different layers","to provide upper management with information about network performance"],"correct":[0],"questionHtml":"<p><strong>What is a reason that a network engineer would use APIs?</strong></p>","explanation":"<p>Application programming interfaces or APIs interact with one or more applications. APIs are commonly used to automate tasks, to facilitate data integration, and to increase the functionality of another application. Non-software engineers can now use APIs to automate configuration or data collection from network devices.</p>","id":172},{"module":"Module 4","section":"4.9.3 Understanding and Using APIs Quiz","source":"mod 4.2.pdf","sourceNumber":8,"questionText":"What is a webhook for REST APIs?","choices":["It is an HTTP redirect to forward the API request to another web service.","It is an HTTP PUT message to update information on a website.","It is an HTTP UPDATE message to notify the user that an API request is successfully completed.","It is an HTTP callback to a URL to notify the client application that an event has occurred."],"correct":[3],"questionHtml":"<p><strong>What is a webhook for REST APIs?</strong></p>","explanation":"<p>A webhook is an HTTP callback, or an HTTP POST, to a specified URL that notifies the client application when a particular activity or event has occurred in one of the resources on the platform.</p>","id":173},{"module":"Module 4","section":"4.9.3 Understanding and Using APIs Quiz","source":"mod 4.2.pdf","sourceNumber":11,"questionText":"What is an application requirement in order to receive a notification from a webhook provider?","choices":["The application must provide a syslog service.","The application must accept HTTP UPDATE messages from the webhook provider.","The application must register a unique domain name from a certificate authority.","The application must always be running to receive HTTP POST requests."],"correct":[3],"questionHtml":"<p><strong>What is an application requirement in order to receive a notification from a webhook provider?</strong></p>","explanation":"<p>In order to receive a notification from a webhook provider, the client application must meet certain requirements: • The application must always be running to receive HTTP POST requests. • The application must register a URI on the webhook provider, so that the provider knows where to send a notification when target events occur. • The application must handle the incoming notifications from the webhook server.</p>","id":174},{"module":"Module 4","section":"4.9.3 Understanding and Using APIs Quiz","source":"mod 4.2.pdf","sourceNumber":12,"questionText":"Which RESTful operation corresponds to the HTTP GET method?","choices":["update","patch","read","post"],"correct":[2],"questionHtml":"<p><strong>Which RESTful operation corresponds to the HTTP GET method?</strong></p>","explanation":"<p>RESTful operations correspond to the following HTTP methods (shown to the left with the RESTful operation on the right): • POST &gt; Create • GET &gt; Read • PUT/PATCH &gt; Update • DELETE &gt; Delete</p>","id":175},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":1,"questionText":"Refer to the exhibit. A network administrator is using a Python script to test a REST API request. The traceback message indicates that there is an error in the URI. What is a possible issue?","choices":["The protocol is wrong.","The query component is missing.","The destination t includes the need for data compression. Which three values are acceptable for the Accept-Encoding request header? (Choose three.)","choices":["*","xz","br","gzip","tar","zip"],"correct":[0,2,3],"questionHtml":"<p><strong>A client is sending a REST API request to a web server. The request includes the need for data compression. Which three values are acceptable for the Accept-Encoding request header? (Choose three.)</strong></p>","explanation":"<p>A few of the acceptable values for the Accept- Encoding request header are gzip, compress, deflate, br, identity, and *.</p>","id":179},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":7,"questionText":"What is a characteristic of a RESTful API?","choices":["It uses HTTP methods to gather and manipulate data.","It is a southbound API.","It facilitates the configuration changes from a network controller to end devices.","It supports a secure data transmission between a remote user and an enterprise network."],"correct":[0],"questionHtml":"<p><strong>What is a characteristic of a RESTful API?</strong></p>","explanation":"<p>RESTful APIs use HTTP methods to gather and manipulate data. They are northbound APIs. Because there is a defined structure for how HTTP works, it offers a consistent way to interact with RESTful APIs from multiple vendors.</p>","id":180},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":8,"questionText":"Which characteristic of the SOAP architecture specifies communication between all similar and dissimilar application types?","choices":["independence","interface uniformity","neutrality","extensibility"],"correct":[0],"questionHtml":"<p><strong>Which characteristic of the SOAP architecture specifies communication between all similar and dissimilar application types?</strong></p>","explanation":"<p>SOAP was designed so that all types of applications can communicate with each other, no matter how dissimilar they are. The applications can be built using different programming languages, can run on different operating systems, and can be as dissimilar as possible.</p>","id":181},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":10,"questionText":"Which SOAP message root element defines the XML document as a SOAP message?","choices":["Meta tag","Body","Envelope","Header"],"correct":[2],"questionHtml":"<p><strong>Which SOAP message root element defines the XML document as a SOAP message?</strong></p>","explanation":"<p>Correct answer: Envelope.</p>","id":182},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":11,"questionText":"Which type of credential information is used for the bearer authentication in REST APIs?","choices":["a username and password set by the client","a password encoded using Base64","an MD5 hash string generated by the client application","a string generated by an authentication server"],"correct":[3],"questionHtml":"<p><strong>Which type of credential information is used for the bearer authentication in REST APIs?</strong></p>","explanation":"<p>Bearer Authentication uses a bearer token, which is a string generated by an authentication server such as an Identity Service (IdS).</p>","id":183},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":12,"questionText":"What are two purposes for using rate limits on public and unrestricted APIs? (Choose two.)","choices":["to avoid a server overloading from too many requests at the same time","to limit the number of authorization requests per API call","to provide better service and response time to all users","to ensure a client uses a multifactor authentication mechanism","to limit the number of passwords that a client can have in making API requests"],"correct":[0,2],"questionHtml":"<p><strong>What are two purposes for using rate limits on public and unrestricted APIs? (Choose two.)</strong></p>","explanation":"<p>Using an API rate limit is a way for a web service to control the number of requests a user or application can make per defined unit of time and it is considered a best practice for public and unrestricted APIs. Some benefits of using rate limits include the following: Avoid a server overload from too many requests at once. Provide better service and response time to all users. Protect against a denial of service (DoS) attack.</p>","id":184},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":13,"questionText":"Which HTTP response status code indicates that the user is not authenticated to access the site?","choices":["201","400","401","403","404"],"correct":[2],"questionHtml":"<p><strong>Which HTTP response status code indicates that the user is not authenticated to access the site?</strong></p>","explanation":"<p>Most common HTTP status codes include the following: • 200 – OK (using GET or POST to exchange data with an API successfully) • 201 – Created (creating resources by using a REST API call successfully) • 400 – Bad Request (The request from the client is failed due to client-side issue.) • 401 – Unauthorized (The client is not authenticated to access site or API call.) • 403 – Forbidden (The access request is not granted based on the supplied credentials.) • 404 – Not Found (The page requested at HTTP URL location does not exist or is hidden.)</p>","id":185},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":14,"questionText":"Which API architectural style uses an XML-based messaging protocol to communicate between applications?","choices":["SOAP","REST","NFS","XML-RPC"],"correct":[0],"questionHtml":"<p><strong>Which API architectural style uses an XML-based messaging protocol to communicate between applications?</strong></p>","explanation":"<p>Simple Object Access Protocol (SOAP) is a messaging protocol used when applications need to communicate. It is an XML-based protocol that was developed by Microsoft.</p>","id":186},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":15,"questionText":"A network engineer is learning about Rest APIs. When executing a particular API, the server responds with curl. How is this information useful?","choices":["Curl shows the retrieved information in JSON format.","Curl shows how to access the content displayed in the response body using curl.","Curl shows the information the API returned from the server.","Curl shows the URL used in the API request."],"correct":[1],"questionHtml":"<p><strong>A network engineer is learning about Rest APIs. When executing a particular API, the server responds with curl. How is this information useful?</strong></p>","explanation":"<p>Clients for URLs (curl or cURL) is a tool used on many platforms for getting or sending files using URL syntax. The information returned can be copied, then used from a command prompt with the curl command to either get information using the GET parameter or send data using the POST parameter.</p>","id":187},{"module":"Module 4","section":"Module 4 Exam","source":"mod 4.pdf","sourceNumber":16,"questionText":"In which situation would a synchronous API be used?","choices":["when a server is not part of the process","when the original API request or data from the request is delayed","when data is being retrieved from a database","when the client is not required to take action"],"correct":[2],"questionHtml":"<p><strong>In which situation would a synchronous API be used?</strong></p>","explanation":"<p>Synchronous APIs respond to a request directly and immediately such as when data is being provided from memory or a database. In contrast, asynchronous APIs may send a notification that a data request has been made, send the data later, trigger a callback to provide the data, or process the request and then take an appropriate action. The action can be immediate, but it does not have to be.</p>","id":188}];

const $=id=>document.getElementById(id);
const els={module:$('moduleFilter'),section:$('sectionFilter'),question:$('question'),choices:$('choices'),category:$('category'),number:$('number'),feedback:$('feedback'),stats:$('stats'),progress:$('progressBar'),multi:$('multiNotice'),card:$('quizCard'),summary:$('summary'),check:$('checkBtn'),next:$('nextBtn'),prev:$('prevBtn')};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sections(){const m=els.module.value;return [...new Set(QUESTIONS.filter(q=>m==='All'||q.module===m).map(q=>q.section))]}
function refreshSections(){const old=els.section.value;els.section.innerHTML='<option value="All">All sections</option>'+sections().map(s=>`<option>${s}</option>`).join('');if([...els.section.options].some(o=>o.value===old))els.section.value=old}
function makePool(doShuffle=false){const m=els.module.value,s=els.section.value;state.pool=QUESTIONS.filter(q=>(m==='All'||q.module===m)&&(s==='All'||q.section===s));state.order=state.pool.map(q=>q.id);if(doShuffle)shuffle(state.order);state.index=0;state.answers={};state.checked={};state.results={};showQuiz();render()}
function current(){return QUESTIONS.find(q=>q.id===state.order[state.index])}
function answerSet(q){return new Set(state.answers[q.id]||[])}
function choose(choice) {
    const q = current();

    if (state.checked[q.id]) return;

    let selected = answerSet(q);

    if (q.correct.length > 1) {
        selected.has(choice)
            ? selected.delete(choice)
            : selected.add(choice);

        state.answers[q.id] = [...selected];
        render();
    } else {
        state.answers[q.id] = [choice];
        check();
    }
}
function renderChoices(q){const picked=answerSet(q),locked=!!state.checked[q.id],letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';els.choices.className='choices'+(q.correct.length>1?' multiple':'');els.choices.innerHTML=q.choices.map((c,i)=>{let cls='choice';if(picked.has(i))cls+=' selected';if(locked&&q.correct.includes(i))cls+=' correct';if(locked&&picked.has(i)&&!q.correct.includes(i))cls+=' wrong';if(locked)cls+=' locked';return `<button type="button" class="${cls}" data-choice="${i}"><span class="marker">${letters[i]||i+1}</span><span>${c}</span></button>`}).join('');els.choices.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(+b.dataset.choice)))}
function renderMatching(q){const selected=state.answers[q.id]||Array(q.pairs.length).fill(null),locked=!!state.checked[q.id];els.choices.className='choices matching';els.choices.innerHTML=q.pairs.map((pair,index)=>{let cls='match-row';if(locked)cls+=selected[index]===index?' correct':' wrong';const options=q.pairs.map((option,optionIndex)=>`<option value="${optionIndex}" ${selected[index]===optionIndex?'selected':''}>${option.right}</option>`).join('');return `<div class="${cls}"><span class="match-term">${pair.left}</span><select data-match="${index}" ${locked?'disabled':''}><option value="">Choose a match</option>${options}</select></div>`}).join('');els.choices.querySelectorAll('select').forEach(select=>select.addEventListener('change',()=>{const answers=state.answers[q.id]||Array(q.pairs.length).fill(null);answers[+select.dataset.match]=select.value===''?null:+select.value;state.answers[q.id]=answers;render()}))}
function render(){if(!state.order.length){els.question.innerHTML='<p>No questions were found for this selection.</p>';els.choices.innerHTML='';return}const q=current(),matching=q.type==='matching';els.category.textContent=`${q.module} · ${q.section}`;els.number.textContent=`Question ${state.index+1} of ${state.order.length}`;els.question.innerHTML=q.questionHtml;els.multi.classList.toggle('hidden',matching||q.correct.length<2);matching?renderMatching(q):renderChoices(q);renderFeedback(q);els.prev.disabled=state.index===0;els.next.textContent=state.index===state.order.length-1?'View score →':'Next →';els.check.classList.toggle('hidden',!matching&&q.correct.length===1);const answers=state.answers[q.id]||[];els.check.disabled=!!state.checked[q.id]||(matching?answers.length!==q.pairs.length||answers.some(answer=>answer===null):!answers.length);const done=Object.keys(state.checked).length;els.stats.textContent=`${done} answered · ${Object.values(state.results).filter(Boolean).length} correct`;els.progress.style.width=`${state.order.length?done/state.order.length*100:0}%`}
function renderFeedback(q){if(!state.checked[q.id]){els.feedback.className='feedback';els.feedback.innerHTML='';return}const good=state.results[q.id];els.feedback.className='feedback show '+(good?'good':'bad');els.feedback.innerHTML=`<h3>${good?'✓ Correct':'✕ Not quite'}</h3><div>${good?'Your answer is correct.':'The correct answer is highlighted above.'}</div><div class="explanation">${q.explanation}</div>`}
function check(){const q=current(),a=[...(state.answers[q.id]||[])];state.checked[q.id]=true;if(q.type==='matching'){state.results[q.id]=q.pairs.every((pair,index)=>a[index]===index)}else{a.sort((x,y)=>x-y);const c=[...q.correct].sort((x,y)=>x-y);state.results[q.id]=a.length===c.length&&a.every((v,i)=>v===c[i])}render()}
function next(){if(state.index===state.order.length-1){showSummary();return}state.index++;render();scrollTo({top:0,behavior:'smooth'})}
function showSummary(){const total=state.order.length,correct=Object.values(state.results).filter(Boolean).length,answered=Object.keys(state.checked).length,pct=total?Math.round(correct/total*100):0;els.card.querySelectorAll('.card-head,.question,.notice,.choices,.feedback,.actions').forEach(e=>e.classList.add('hidden'));els.summary.classList.add('show');$('scoreRing').style.setProperty('--pct',pct+'%');$('scoreText').textContent=pct+'%';$('summaryText').textContent=`You answered ${answered} of ${total} questions and got ${correct} correct.`}
function showQuiz(){els.card.querySelectorAll('.card-head,.question,.choices,.actions').forEach(e=>e.classList.remove('hidden'));els.summary.classList.remove('show')}
els.module.addEventListener('change',()=>{refreshSections();makePool()});els.section.addEventListener('change',()=>makePool());$('shuffleBtn').addEventListener('click',()=>makePool(true));$('restartBtn').addEventListener('click',()=>makePool());$('tryAgainBtn').addEventListener('click',()=>makePool(true));els.check.addEventListener('click',check);els.next.addEventListener('click',next);els.prev.addEventListener('click',()=>{if(state.index>0){state.index--;render()}});
Object.entries(MIDTERM_VISUALS).forEach(([number,src])=>{const question=MIDTERM_QUESTIONS.find(q=>q.sourceNumber===+number);if(question&&!question.questionHtml.includes(src))question.questionHtml+=`<img src="${src}" alt="Question exhibit">`});QUESTIONS.push(...MODULE_3_4_QUESTIONS.filter(q=>q.type==='matching'||(q.choices.length&&q.correct.length)),...SA2_QUESTIONS,...MIDTERM_QUESTIONS);refreshSections();makePool();
</script>
