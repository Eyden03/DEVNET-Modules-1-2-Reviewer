*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:var(--ink);font:16px/1.55 Inter,Segoe UI,Arial,sans-serif}.app{min-height:100vh}.hero{background:linear-gradient(135deg,var(--navy),#0a3458);color:#fff;padding:28px 20px}.hero-inner,.main{max-width:1000px;margin:auto}.eyebrow{margin:0 0 5px;color:#78e0eb;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(1.65rem,4vw,2.45rem)}.hero p{margin:7px 0 0;color:#d4e5f4}.controls{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 16px #10243b0d}.controls-inner{max-width:1000px;margin:auto;padding:14px 20px;display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:end}label span{display:block;margin-bottom:5px;color:var(--muted);font-size:.78rem;font-weight:750;text-transform:uppercase}select,button{font:inherit}select,.btn{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;color:var(--ink)}select{width:100%}.btn{cursor:pointer;font-weight:750}.btn:hover{border-color:#91a4ba}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#075bd4}.btn:disabled{opacity:.45;cursor:not-allowed}.main{padding:22px 20px 44px}.status{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}.progress-track{height:9px;border-radius:99px;background:#dce5ef;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .25s}.stats{white-space:nowrap;font-weight:750;color:#405169}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px #11253d12;overflow:hidden}.card-head{display:flex;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);background:#f9fbfd}.badge{display:inline-block;border-radius:99px;background:#e5f0ff;color:#0757bd;padding:4px 9px;font-size:.77rem;font-weight:800}.number{color:var(--muted);font-weight:750}.question{padding:22px 20px 10px;font-size:1.08rem}.question p:first-child{margin-top:0}.question strong{font-weight:760}.question pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#eaf2ff;border-radius:10px;padding:14px;font:14px/1.5 Consolas,monospace}.question img{display:block;max-width:100%;height:auto;margin:14px auto;border-radius:8px}.choices{display:grid;gap:10px;padding:8px 20px 20px}.choice{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;cursor:pointer}.choice:hover{border-color:#89a8cd;background:#f8fbff}.choice .marker{display:grid;place-items:center;width:24px;height:24px;border:2px solid #9caabd;border-radius:50%;font-size:.77rem;font-weight:800}.multiple .choice .marker{border-radius:6px}.choice.selected{border-color:var(--blue);background:#eef5ff}.choice.selected .marker{border-color:var(--blue);background:var(--blue);color:#fff}.choice.correct{border-color:var(--good);background:var(--goodbg)}.choice.correct .marker{border-color:var(--good);background:var(--good);color:#fff}.choice.wrong{border-color:var(--bad);background:var(--badbg)}.choice.wrong .marker{border-color:var(--bad);background:var(--bad);color:#fff}.choice.locked{cursor:default}.actions{display:flex;gap:10px;justify-content:space-between;padding:15px 20px;border-top:1px solid var(--line);background:#fbfcfe}.actions .right{display:flex;gap:10px}.feedback{display:none;margin:0 20px 20px;border-radius:12px;padding:15px 17px}.feedback.show{display:block}.feedback.good{background:var(--goodbg);border:1px solid #a9dfc2}.feedback.bad{background:var(--badbg);border:1px solid #f0bac0}.feedback h3{margin:0 0 7px;font-size:1rem}.explanation{margin-top:10px;padding-top:10px;border-top:1px solid #cad8cf}.explanation p{margin:.35rem 0}.summary{display:none;text-align:center;padding:40px 24px}.summary.show{display:block}.score-ring{display:grid;place-items:center;width:132px;height:132px;margin:0 auto 18px;border-radius:50%;background:conic-gradient(var(--blue) var(--pct),#e3e9f1 0);position:relative}.score-ring:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:#fff}.score-ring strong{position:relative;z-index:1;font-size:1.5rem}.notice{background:var(--warnbg);border:1px solid #f0d28e;color:#6d4600;border-radius:10px;padding:10px 13px;margin:0 20px 14px;font-size:.92rem}.hidden{display:none!important}.footer-note{text-align:center;color:var(--muted);font-size:.82rem;margin-top:18px}@media(max-width:720px){.controls-inner{grid-template-columns:1fr 1fr}.controls-inner .btn{width:100%}.status{grid-template-columns:1fr}.stats{text-align:right}.actions{align-items:stretch}.actions,.actions .right{flex-wrap:wrap}.actions .btn{flex:1}.question,.choices{padding-left:15px;padding-right:15px}.feedback{margin-left:15px;margin-right:15px}}
.match-row{display:grid;grid-template-columns:minmax(140px,1fr) 1.6fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}.match-row.correct{border-color:var(--good);background:var(--goodbg)}.match-row.wrong{border-color:var(--bad);background:var(--badbg)}.match-term{font-weight:750}.match-row select:disabled{opacity:1;color:var(--ink)}

<script>
const QUESTIONS = [{"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 1, "questionHtml": "<strong>1. A system administrator issues the apt-get upgrade command on a Linux operating system. What is the purpose of this command? <\/strong>\n", "questionText": "1. A system administrator issues the apt-get upgrade command on a Linux operating system. What is the purpose of this command?", "choices": ["Every application installed will update itself to the latest version.", "Operating system updates are downloaded and will be installed.", "The remote repository of applications and dependencies will be updated to the latest version.", "A specific application named upgrade will be installed."], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> When the <code>apt-get upgrade<\/code> command is isued in a Linux terminal, all installed applications will attempt to upgrade to the latest version available.<\/p><\/div>\n", "id": 1}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 2, "questionHtml": "<p><strong>2. A Linux system administrator is searching the passwd file for any username that starts with a digit. Which <code>grep<\/code> command should the administrator use? <\/strong><\/p>\n", "questionText": "2. A Linux system administrator is searching the passwd file for any username that starts with a digit. Which  grep  command should the administrator use?", "choices": ["grep '(0-9}' /etc/passwd", "grep '[0-9]' /etc/passwd", "grep '_[0-9]' /etc/passwd", "grep '^[0-9]' /etc/passwd"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The grep Linux command can be used to process text line by line and to print any lines which match a specified pattern. The matching patterns are based on regular expression (regex) query modifiers used to select the appropriate content. Some regex query modifiers are as follows:<br>\n_ (underscore): matches a space<br>\n^ (caret): indicates the start of a string<br>\n$ (dollar sign): indicates the end of a string<br>\n. (period): matches a single character, including a space<br>\n* (asterisk): matches zero or more occurrences of the preceding character<br>\n[ ] (square bracket): matches a character<br>\n{ } (curly bracket): repeats preceding character<\/p><\/div>\n", "id": 2}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 3, "questionHtml": "<p><strong>3. What is the output when the following code is entered into a Python program interpreter?<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>[1,2,4,5] + [3,6]<\/pre><\/div>\n", "questionText": "3. What is the output when the following code is entered into a Python program interpreter? \n [1,2,4,5] + [3,6]", "choices": ["[1,2,3,4,5,6]", "[12]+[9]", "[21]", "[1,2,4,5,3,6]"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The Python interpreter performs concatenation of two lists without reordering the list elements<\/p><\/div>\n", "id": 3}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 4, "questionHtml": "<p><strong>4. What is displayed after the following code is entered into a Python interpreter? <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>addition = 22 +10 \nprint(addition)<\/pre><\/div>\n", "questionText": "4. What is displayed after the following code is entered into a Python interpreter?  \n addition = 22 +10 \nprint(addition)", "choices": ["nothing ( because the print command is wrong)", "[22]+[10]", "(syntaxerror)-...as there should not be a space between the numerical values", "32"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The Python interpreter will perform the operation and display the result, 32.<\/p><\/div>\n", "id": 4}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 5, "questionHtml": "<p><strong>5. A Linux administrator is attempting to use a terminal to configure the network interface card on a computer. The administrator receives a message that the administrator does not have necessary permissions to perform the configuration. What should be done prior to the configuration command?<\/strong><\/p>\n", "questionText": "5. A Linux administrator is attempting to use a terminal to configure the network interface card on a computer. The administrator receives a message that the administrator does not have necessary permissions to perform the configuration. What should be done prior to the configuration command?", "choices": ["identify a different network interface", "use a different user account", "use the sudo command", "change the chmod permissions on the network configuration file"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> Multiple terminal commands require the use of the sudo command as a preface. The command sudo means \"super user do\". Sudo will require an administrator password be entered to complete a configuration. Malicious software usually cannot do damage on its own without knowing the password first.<\/p><\/div>\n", "id": 5}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 6, "questionHtml": "<p><strong>6. A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command <code>ifconfig -a<\/code>. What is the resuit of this command? <\/strong><\/p>\n", "questionText": "6. A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command  ifconfig -a . What is the resuit of this command?", "choices": ["All active interfaces will display information.", "The ARP table of the computer will be displayed.", "Both active and inactive interfaces will display information.", "The host routing table will be displayed."], "correct": [2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The ifconfig command with the -a modifier will provide information for all network interfaces, even if they are down.<\/p><\/div>\n", "id": 6}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 7, "questionHtml": "<p><strong>7. A system administrator attempts to determine what is causing a computer to perform slower than normal. The administrator issues the <code>ps<\/code> command. What is displayed by this command? <\/strong><\/p>\n", "questionText": "7. A system administrator attempts to determine what is causing a computer to perform slower than normal. The administrator issues the  ps  command. What is displayed by this command?", "choices": ["current RAM usage", "current NIC status", "active processes using CPU time", "current HDD usage"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The ps command can be combined with multiple modifiers to display all processes running on a computer, view a specific process, or end processes that are using CPU time.<\/p><\/div>\n", "id": 7}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 8, "questionHtml": "<p><strong>8. A user issues the Linux command ls -l myfile.sh to check the permission of the file myfile.sh. <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>devasc@labvm:~/Documents$ ls -l myfile.sh \n-rwxr-xr-- 1 self test 15 Mar 30 21:24 myfile.sh<\/pre><\/div>\n<p><strong>Which two statements describe the permissions assigned to the file? (Choose two.)<\/strong><\/p>\n", "questionText": "8. A user issues the Linux command ls -l myfile.sh to check the permission of the file myfile.sh.  \n devasc@labvm:~/Documents$ ls -l myfile.sh \n-rwxr-xr-- 1 self test 15 Mar 30 21:24 myfile.sh \n Which two statements describe the permissions assigned to the file? (Choose two.)", "choices": ["Any user in the self group can read, modify, and execute the file.", "The user with the user ID of self can modify the file.", "The user with the user ID of devasc can modify the file.", "All users can execute the file.", "Any user in the test group can execute the file."], "correct": [1, 4], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The <code>ls -l<\/code> command provides a \"long list\" format with more information that includes the following:<\/p>\n<p>File type: The hyphen (-) represents a regular file, the d represents a directory.<br>\nFile permissions: The first three letters represent the permissions of the file owner over the file, the next three letters represent the permissions of the group over the file, and the last three letters represent the permissions of others over the fie. The permission letters are as follows:<\/p>\n<p>r- read or copy the file<br>\nw- write to the file<br>\nx- execute the file<br>\nhyphen (-) - no value assigned<br>\nNumber of hard links to the file: 1 in this case<br>\nFile owner, self in this case<br>\nFile group: test in this case<br>\nFile size. 15 bytes in this case<\/p><\/div>\n", "id": 8}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 9, "questionHtml": "<p><strong>9. Which Python command creates a conditional control structure? <\/strong><\/p>\n", "questionText": "9. Which Python command creates a conditional control structure?", "choices": ["def", "delay", "from", "if"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The commands <code>if<\/code> and <code>else<\/code> are used for conditional logic. The commands <code>for<\/code> and <code>while<\/code> are used for repetition logic, and <code>from<\/code> is for module importing.<\/p><\/div>\n", "id": 9}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 10, "questionHtml": "<p><strong>10. A user enters the commands as shown. What is the result after the <code>mv<\/code> command is entered? <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>devasc@labvm:~/Documents$ pwd \n/home/devasc/Documents \ndevasc@labvm:~/Documents$ mv myfile.sh ../Desktop/myfile2.sh<\/pre><\/div>\n", "questionText": "10. A user enters the commands as shown. What is the result after the  mv  command is entered?  \n devasc@labvm:~/Documents$ pwd \n/home/devasc/Documents \ndevasc@labvm:~/Documents$ mv myfile.sh ../Desktop/myfile2.sh", "choices": ["The file myfile.sh is copied to the /home/devasc/Desktop directory and renamed as myfile2.sh.", "The file myfile.sh is copied to the /home/devasc/Desktop directory and replaces the file myfile2.sh.", "The file myfile.sh is copied and renamed to myfile2.sh in the current directory.", "The file myfile.sh is moved to the /home/devasc/Desktop directory and renamed as myfile2.sh."], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The mv Linux command can be used either to move a file to a different directory or to rename a file. The syntax of the command is mv source destination . In this case, the destination filename is different and the file is renamed after it is moved.<\/p><\/div>\n", "id": 10}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 11, "questionHtml": "<p><strong>11. A student new to Python is working in the interactive interpreter mode. The student issues the commands:<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; ipAddress = {\"R1\":\"10.1.1.1\",\"R2\":\"10.2.2.1\",\"R3\":\"10.3.3.1\"}<\/pre><\/div>\n<p><strong>Which data type is used to represent the variable ipAddress? <\/strong><\/p>\n", "questionText": "11. A student new to Python is working in the interactive interpreter mode. The student issues the commands: \n >>> ipAddress = {\"R1\":\"10.1.1.1\",\"R2\":\"10.2.2.1\",\"R3\":\"10.3.3.1\"} \n Which data type is used to represent the variable ipAddress?", "choices": ["list", "array", "tuple", "dictionary"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> In Python, a variable using the dictionary type can be created by placing a sequence of elements within curly braces {}, separated by a comma. Each element in a dictionary holds a pair of values, one being the key and the other corresponding pair element being its assigned value, in the format of key:value.<\/p><\/div>\n", "id": 11}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 12, "questionHtml": "<p><strong>12. A student new to Python is working in the interactive interpreter mode. The student issues the command: <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; ipAddress = {\"R1\":\"10.1.1.1\",\"R2\":\"10.2.2.1\",\"R3\":\"10.3.3.1\"}<\/pre><\/div>\n<p><strong>Which Python expression can be used to retrieve the IP address of R2? <\/strong><\/p>\n", "questionText": "12. A student new to Python is working in the interactive interpreter mode. The student issues the command:  \n >>> ipAddress = {\"R1\":\"10.1.1.1\",\"R2\":\"10.2.2.1\",\"R3\":\"10.3.3.1\"} \n Which Python expression can be used to retrieve the IP address of R2?", "choices": ["ipAddress{'R2'}", "ipAddress['R2']", "ipAddress[R2]", "ipAddress{\"R2\"}"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> In Python, an object inside a dictionary structure is referenced by using its key and the key is enclosed with brackets [ ].<\/p><\/div>\n", "id": 12}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 13, "questionHtml": "<p><strong>13. A user issues a series of Linux commands as shown. <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>(omitted)$ pwd \n/home/devasc/labs/ansible/backups \n(omitted)$ cd ../..<\/pre><\/div>\n<p><strong>Which directory is the current directory after the <code>cd<\/code> command is entered? <\/strong><\/p>\n", "questionText": "13. A user issues a series of Linux commands as shown.  \n (omitted)$ pwd \n/home/devasc/labs/ansible/backups \n(omitted)$ cd ../.. \n Which directory is the current directory after the  cd  command is entered?", "choices": ["/", "/home", "/home/devasc/", "/home/devasc/labs", "/home/devasc/labs/ansible"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The Linux cd command is used to change from the current directory to another directory in the file system. The cd command with the .. or ../ option will move up a single directory. This option can be used in the format of multiple ../.. to move back multiple directories in the directory structure.<\/p><\/div>\n", "id": 13}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 14, "questionHtml": "<p><strong>14. A student new to Python is working in the interactive interpreter mode. The student issues the commands: <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; devicenames=[\"RT1\", \"RT2\", \"SW1\", \"SW2\"]\n&gt;&gt;&gt; hostnames=devicenames + [\"RT3\", \"SW3\"]\n&gt;&gt;&gt; del hostnames[3]\n&gt;&gt;&gt; hostnames<\/pre><\/div>\n<p><strong>What is the result? <\/strong><\/p>\n", "questionText": "14. A student new to Python is working in the interactive interpreter mode. The student issues the commands:  \n >>> devicenames=[\"RT1\", \"RT2\", \"SW1\", \"SW2\"]\n>>> hostnames=devicenames + [\"RT3\", \"SW3\"]\n>>> del hostnames[3]\n>>> hostnames \n What is the result?", "choices": ["['RT1', 'RT2', 'RT3', 'SW2, 'SW3']", "['RT1', 'RT2', 'SW2', 'RT3', 'SW3']", "['RT1', 'RT2', 'SW1', 'RT3', 'SW3']", "['RT1', 'RT2', 'SW1', 'SW2', 'SW3']"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> In Python, two lists can be concatenated by using the + operator. The second list appends to the first list and makes a new list. An item in a list can be referenced and manipulated using its index. The first item in a list is indexed as zero, the second is indexed as one, and so on.<\/p><\/div>\n", "id": 14}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 15, "questionHtml": "<p><strong>15. A student is learning Python in the interactive interpreter mode. The student issues the commands: <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; y=2\n&gt;&gt;&gt; y*3\n6\n&gt;&gt;&gt; 'Test'*y<\/pre><\/div>\n<p><strong>What is the result? <\/strong><\/p>\n", "questionText": "15. A student is learning Python in the interactive interpreter mode. The student issues the commands:  \n >>> y=2\n>>> y*3\n6\n>>> 'Test'*y \n What is the result?", "choices": ["'Test2", "'Test6'", "TypeError: A string type cannot be multiplied by an integer.", "'TestTest'", "'TestTestTestTestTestTest'"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> Python can be used to multiply numbers as well as strings. A string multiplied by an integer will produce multiple copies of the string. Because the y variable is 2, the word Test is listed twice.<\/p><\/div>\n", "id": 15}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 16, "questionHtml": "<p><strong>16. A student is learning Python and is reviewing a Python script as follows: <\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>aclNum = int(input(\"What is the IPv4 ACL number? \"))\nif aclNum &gt;= 1 and aclNum &lt;= 99:\n     print(\"This is a standard IPv4 ACL.\")\nelif aclNum &gt;=100 and aclNum &lt;= 199:\n     print(\"This is an extended IPv4 ACL.\")\nelse:\n     print(\"This is not a standard or extended IPv4 ACL.\")<\/pre><\/div>\n<p><strong>Under which condition will the <code>elif  <\/code> statement be evaluated?<\/strong><\/p>\n", "questionText": "16. A student is learning Python and is reviewing a Python script as follows:  \n aclNum = int(input(\"What is the IPv4 ACL number? \"))\nif aclNum >= 1 and aclNum <= 99:\n     print(\"This is a standard IPv4 ACL.\")\nelif aclNum >=100 and aclNum <= 199:\n     print(\"This is an extended IPv4 ACL.\")\nelse:\n     print(\"This is not a standard or extended IPv4 ACL.\") \n Under which condition will the  elif    statement be evaluated?", "choices": ["when the input is a float number", "when the first print statement fails", "when the input is a string", "when the if statement is false"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> In this script, the <code>elif<\/code>  statement is evaluated if the if statement is false and it is before the else statement.<\/p><\/div>\n", "id": 16}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 17, "questionHtml": "<p><strong>17. A user issues a Linux command and the result is shown:<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>total 40 \ndrwxr-xr-x 2 devasc devasc 4096 Mar 30 21:25 Desktop \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Documents \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Downloads \ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:21 labs \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Music \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Pictures \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Public \ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:24 snap \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Templates \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Videos \ndevasc@labvm:~$<\/pre><\/div>\n<p><strong>Which Linux command is used to display the contents of the current directory as shown? <\/strong><\/p>\n", "questionText": "17. A user issues a Linux command and the result is shown: \n total 40 \ndrwxr-xr-x 2 devasc devasc 4096 Mar 30 21:25 Desktop \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Documents \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Downloads \ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:21 labs \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Music \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Pictures \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Public \ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:24 snap \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Templates \ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Videos \ndevasc@labvm:~$ \n Which Linux command is used to display the contents of the current directory as shown?", "choices": ["ls -a", "ls -l", "ls", "ls -lr"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Linux <code>ls<\/code> command with the -l option is used to display contents in the current directory with a long list', which provides more information about each file or subdirectory, such as permissions, owner, size, and creation date.<\/p><\/div>\n", "id": 17}, {"module": "Module 1", "section": "Module 1 Exam", "source": "devnet-associate-version-1-0-module-1-exam-answers.html", "sourceNumber": 18, "questionHtml": "<p><strong>18. A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a . What is the result of this command?<\/strong><\/p>\n", "questionText": "18. A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a . What is the result of this command?", "choices": ["The host routing table will be displayed.", "All active interfaces will display information.", "Both active and inactive interfaces will display information.", "The ARP table of the computer will be displayed."], "correct": [2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The <code>ifconfig<\/code> command with the <code>-a<\/code> modifier will provide information for all network interfaces, even if they are down.<\/p><\/div>\n\t\t\t\t\t\t\t\t\t\t", "id": 18}, {"module": "Module 1", "section": "1.2.3 Linux Review", "source": "DevNet Associate 1.2.3 Quiz - Linux Review (Answers).html", "sourceNumber": 1, "questionHtml": "<p><strong>1. What Linux command is used to display the contents of the current directory?<\/strong><\/p>\n", "questionText": "1. What Linux command is used to display the contents of the current directory?", "choices": ["pwd", "cat", "ln", "ls"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Linux <strong>ls<\/strong> command, without any options, is used to display the contents, such as files and subdirectories, of the current directory.<\/p><\/div>\n", "id": 19}, {"module": "Module 1", "section": "1.2.3 Linux Review", "source": "DevNet Associate 1.2.3 Quiz - Linux Review (Answers).html", "sourceNumber": 2, "questionHtml": "<p><strong>2. What command is used to rename a file in a Linux system?<\/strong><\/p>\n", "questionText": "2. What command is used to rename a file in a Linux system?", "choices": ["mv", "dd", "cp", "rm"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The <strong>mv<\/strong> Linux command can be used to move a file to another directory or rename a file. The <strong>cp<\/strong> command is used to make a copy of files or directories. The <strong>dd<\/strong> command is also used to make a copy of a file. The <strong>rm<\/strong> command is used to delete a file.<\/p><\/div>\n", "id": 20}, {"module": "Module 1", "section": "1.2.3 Linux Review", "source": "DevNet Associate 1.2.3 Quiz - Linux Review (Answers).html", "sourceNumber": 3, "questionHtml": "<p><strong>3. A user issues a Linux command and the result is shown.<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>total 40\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Videos\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Templates\ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:24 snap\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Public\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Pictures\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Music\ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:21 labs\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Downloads\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Documents\ndrwxr-xr-x 2 devasc devasc 4096 Mar 30 21:25 Desktop\ndevasc@labvm:~$<\/pre><\/div>\n<p><strong>Which Linux command is used to display the contents of the current directory as shown?<\/strong><\/p>", "questionText": "3. A user issues a Linux command and the result is shown. \n total 40\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Videos\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Templates\ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:24 snap\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Public\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Pictures\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Music\ndrwxr-xr-x 5 devasc devasc 4096 Mar 30 21:21 labs\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Downloads\ndrwxr-xr-x 2 devasc devasc 4096 Apr 15 19:09 Documents\ndrwxr-xr-x 2 devasc devasc 4096 Mar 30 21:25 Desktop\ndevasc@labvm:~$ \n Which Linux command is used to display the contents of the current directory as shown?", "choices": ["ls -l", "ls -a", "ls -lr", "ln"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Linux <strong>ls<\/strong> command with the <strong>-l<\/strong> option is used to display contents in the current directory as a “long list”. By default, the listing is sorted alphabetically. With both the <strong>-l<\/strong> and <strong>-r<\/strong> options specified, the listing is displayed as a long list and in reverse order.<\/p><\/div>\n", "id": 21}, {"module": "Module 1", "section": "1.2.3 Linux Review", "source": "DevNet Associate 1.2.3 Quiz - Linux Review (Answers).html", "sourceNumber": 4, "questionHtml": "<p><strong>4. A system administrator of a Linux server is searching the passwd file for the username taylor that appears at the beginning of the line. Which grep command should the administrator use?<\/strong><\/p>\n", "questionText": "4. A system administrator of a Linux server is searching the passwd file for the username taylor that appears at the beginning of the line. Which grep command should the administrator use?", "choices": ["grep taylor /etc/passwd", "grep '.taylor' /etc/passwd", "grep '^taylor' /etc/passwd", "grep '[taylor]' /etc/passwd"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Linux <strong>grep<\/strong> command can be used to process text line by line and to print any lines which match a specified pattern. The matching patterns are based on regular expression (regex) query modifiers used to select the appropriate content. Some regex query modifiers are as follows:<br>\n(underscore): matches a space<br>\n^ (caret): indicates the start of a string<br>\n$ (dollar sign): indicates the end of a string<br>\n. (period): matches a single character, including a space<br>\n(asterisk): matches zero or more occurrences of the preceding character<br>\n(square bracket): matches a character<br>\n{ } (curly bracket): repeats preceding character<\/p><\/div>\n", "id": 22}, {"module": "Module 1", "section": "1.2.3 Linux Review", "source": "DevNet Associate 1.2.3 Quiz - Linux Review (Answers).html", "sourceNumber": 5, "questionHtml": "<p><strong>5. A user issues the apt-get upgrade command to update system files in a Ubuntu Linux system and receives an error message of \"permission denied.\" What should the user do to complete the task?<\/strong><\/p>\n", "questionText": "5. A user issues the apt-get upgrade command to update system files in a Ubuntu Linux system and receives an error message of \"permission denied.\" What should the user do to complete the task?", "choices": ["Issue the allow apt-get upgrade command.", "Issue the sudo apt-get install command.", "Issue the apt-get install --allow command.", "Issue the sudo apt-get upgrade command."], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> There are several Linux commands in the Advanced Package Tool (APT) system to perform software package management tasks. The apt-get upgrade command is used to update all packages and dependencies on the system. This command must be run with administrative level permissions, which are provided by the sudo command.<\/p><\/div>\n\t\t\t\t\t\t\t\t\t\t", "id": 23}, {"module": "Module 1", "section": "1.3.4 Python Review", "source": "DevNet Associate 1.3.4 Quiz - Python Review (Answers).html", "sourceNumber": 1, "questionHtml": "<p><strong>1. A student is learning Python using the interactive interpreter mode. The student issues the commands:<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; routers=[]\n&gt;&gt;&gt; switches=[]\n&gt;&gt;&gt; devices=[\\\"RT1\\\", \\\"RT2\\\", \\\"RT3\\\", SW1\\\", \\\"SW2\\\", \\\"SW3\\\"]\n&gt;&gt;&gt; devices=devices + [\\\"RT4\\\", \\\"SW4\\\"]\n&gt;&gt;&gt; for i in devices:\nif \\\"R\\\" in i:\nrouters.append(i)\nelse: switches.append(i)\n&gt;&gt;&gt; switches<\/pre><\/div>\n<p><strong>What is the result?<\/strong><\/p>\n", "questionText": "1. A student is learning Python using the interactive interpreter mode. The student issues the commands: \n >>> routers=[]\n>>> switches=[]\n>>> devices=[\\\"RT1\\\", \\\"RT2\\\", \\\"RT3\\\", SW1\\\", \\\"SW2\\\", \\\"SW3\\\"]\n>>> devices=devices + [\\\"RT4\\\", \\\"SW4\\\"]\n>>> for i in devices:\nif \\\"R\\\" in i:\nrouters.append(i)\nelse: switches.append(i)\n>>> switches \n What is the result?", "choices": ["['SW4', 'SW3', 'SW2', 'SW1']", "['SW1', 'SW2', 'SW3']", "['SW4', 'SW1', 'SW2', 'SW3']", "['SW4']", "['SW1', 'SW2', 'SW3', 'SW4']"], "correct": [4], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> In Python, two lists can be concatenated by using the + (plus sign) operator. The second list appends to the first list and makes a new list. The Python <strong>for<\/strong> function is used to loop through the elements in a list and perform an operation on an element. The <strong>if<\/strong> statement can be used within the <strong>for<\/strong> function to determine the proper action based on the matching condition of each element.<\/p><\/div>\n", "id": 24}, {"module": "Module 1", "section": "1.3.4 Python Review", "source": "DevNet Associate 1.3.4 Quiz - Python Review (Answers).html", "sourceNumber": 2, "questionHtml": "<p><strong>2. A student is learning Python in the interactive interpreter mode. The student issues the commands:<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; devicenames=[\\\"RT1\\\", \\\"RT2\\\", \\\"SW1\\\", \\\"SW2\\\"]\n&gt;&gt;&gt; devicenames[-1]<\/pre><\/div>\n<p><strong>What is the result?<\/strong><\/p>", "questionText": "2. A student is learning Python in the interactive interpreter mode. The student issues the commands: \n >>> devicenames=[\\\"RT1\\\", \\\"RT2\\\", \\\"SW1\\\", \\\"SW2\\\"]\n>>> devicenames[-1] \n What is the result?", "choices": ["['RT2', 'SW1', 'SW2']", "SW1", "RT1", "SW2", "an error message"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> In Python, an item in a list can be referenced and manipulated using its index. The first item in a list is indexed as zero, the second is indexed as one, and so on. The last item can also be referenced with an index of [-1].<\/p><\/div>\n", "id": 25}, {"module": "Module 1", "section": "1.3.4 Python Review", "source": "DevNet Associate 1.3.4 Quiz - Python Review (Answers).html", "sourceNumber": 3, "questionHtml": "<p><strong>3. A developer needs to check the version of the running Python package. Which command should the developer use?<\/strong><\/p>\n", "questionText": "3. A developer needs to check the version of the running Python package. Which command should the developer use?", "choices": ["python3 -i", "python3 -q", "python3 --v", "python3 -V"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The command <strong>python3<\/strong> starts Python, but adding the <strong>-V<\/strong> option displays the specific version being used. <\/p><\/div>\n", "id": 26}, {"module": "Module 1", "section": "1.3.4 Python Review", "source": "DevNet Associate 1.3.4 Quiz - Python Review (Answers).html", "sourceNumber": 4, "questionHtml": "<p><strong>4. A student is learning Python in the interactive interpreter mode. The student issues the command:<\/strong><\/p>\n<div class=\"cbc-code-wrapper\"><div class=\"cbc-code-bar\"><\/div><pre>&gt;&gt;&gt; type(True)<\/pre><\/div>\n<p><strong>What is the data type reported by Python?<\/strong><\/p>\n", "questionText": "4. A student is learning Python in the interactive interpreter mode. The student issues the command: \n >>> type(True) \n What is the data type reported by Python?", "choices": ["Boolean", "integer", "string", "float"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> A type of True or False is a predefined value of the Boolean data type.<\/p><\/div>\n", "id": 27}, {"module": "Module 1", "section": "1.3.4 Python Review", "source": "DevNet Associate 1.3.4 Quiz - Python Review (Answers).html", "sourceNumber": 5, "questionHtml": "<p><strong>5. Which Python programming function is used to display output?<\/strong><\/p>", "questionText": "5. Which Python programming function is used to display output?", "choices": ["if", "for", "print", "while"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> Print is used to display output in a Python programing language interpreter.<\/p><\/div>\n\t\t\t\t\t\t\t\t\t\t", "id": 28}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 1, "questionHtml": "<p><strong>1. What is network programmability?<\/strong><\/p>\n", "questionText": "1. What is network programmability?", "choices": ["the ability to easily monitor network devices using traditional network protocols", "the ability to program network devices using repettive manual configuration via a terminal and command sets", "the ability to configure, monitor, and react to events in the network in real time", "the ability to configure virtualized networks and deploy virtualized services in real time"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> Network programmability is defined as the abity to configure, monitor, and react to events in the network in real tme through the use of APIs.<\/p><\/div>\n", "id": 29}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 2, "questionHtml": "<p><strong>2. What is the purpose of Cisco DevNet? <\/strong><\/p>\n", "questionText": "2. What is the purpose of Cisco DevNet?", "choices": ["to be the central resource for everything about networking at Cisco", "to teach everyone about the different Cisco API offerings and how to use them", "to teach specific coding courses such as advanced Python and implementing REST APIs", "to be the central resource for advanced software developers and the use of Cisco APIs"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> Cisco DevNet exists to teach everyone about the different Cisco API offerings and how to use them. In addition, DevNet also teaches generic coding courses.<\/p><\/div>\n", "id": 30}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 3, "questionHtml": "<p><strong>3. What are two benefits of using APIs and integrations between applications? (Choose two.) <\/strong><\/p>\n", "questionText": "3. What are two benefits of using APIs and integrations between applications? (Choose two.)", "choices": ["Integrations are used to verify compatibility between different applications.", "Integrations enable the applications to run a Docker instance using Hyper-V.", "Integrations enable the applications to be installed on any operating system type.", "Integrations are used to provide applications the ability to notify each other when a specific event happens.", "Integrations enable the applications to request actions from each other."], "correct": [3, 4], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> Integrations build a network between multiple applications. This allows the applications to share data, request actions to be performed, or even notify each other when a specific event happens.<\/p><\/div>\n", "id": 31}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 4, "questionHtml": "<p><strong>4. What is the contracted response time after a developer opens a case-based ticket with the DevNet support service? <\/strong><\/p>", "questionText": "4. What is the contracted response time after a developer opens a case-based ticket with the DevNet support service?", "choices": ["one week", "five business days", "one hour", "one business day"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The response time on developer support case-based tickets is within one business day.<\/p><\/div>\n", "id": 32}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 5, "questionHtml": "<p><strong> 5. Which Cisco DevNet developer support option provides 1-on-1 support to the members of the Solution Partner program? <\/strong><\/p>\n", "questionText": "5. Which Cisco DevNet developer support option provides 1-on-1 support to the members of the Solution Partner program?", "choices": ["case-based ticket", "community forum", "knowledge base", "chat with DevNet"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The case-based ticket DevNet developer support option provides 1-on-1 support for certain Cisco APIs at a cost.<\/p><\/div>\n", "id": 33}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 6, "questionHtml": "<p><strong>6. Which technology trend enables an industry shift towards automation, applications, and integrations? <\/strong><\/p>\n", "questionText": "6. Which technology trend enables an industry shift towards automation, applications, and integrations?", "choices": ["smaler and faster CPUs", "advanced API capabilities", "increased storage and RAM", "increased intenet connection bandwidth"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> APIs, known as application programming interfaces, are causing a shift in the IT industry through the replacement of repetitive manual tasks with automation.<\/p><\/div>\n", "id": 34}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 7, "questionHtml": "<p><strong>7. What resources are available in the Cisco DevNet sandboxes?<\/strong><\/p>\n", "questionText": "7. What resources are available in the Cisco DevNet sandboxes?", "choices": ["self-paced tutorials that cover a wide range of automation and integration topics", "support for developer-related issues through the use of forums and live chats", "a repository of sample code writen by developers", "production-like development and code testing environments"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The Cisco DevNet sandboxes provide users with a production-like development and testing environments for a lot of the Cisco technologies.<\/p><\/div>\n", "id": 35}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 8, "questionHtml": "<p><strong>8. Which link is used from the Cisco DevNet Learning Labs to access the largest collections of labs? <\/strong><\/p>", "questionText": "8. Which link is used from the Cisco DevNet Learning Labs to access the largest collections of labs?", "choices": ["Sections", "Modules", "Bookends", "Tracks"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The DevNet Learning Labs consist of tracks that contain modules and modules contain labs. So, the largest collection of Learning Labs is tracks.<\/p><\/div>\n", "id": 36}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 9, "questionHtml": "<p><strong>9. Which Cisco DevNet online resource provides use cases for network automation, including listing data and activating policies across domains?<\/strong><\/p>\n", "questionText": "9. Which Cisco DevNet online resource provides use cases for network automation, including listing data and activating policies across domains?", "choices": ["Automation Exchange", "DevNet Learning Labs", "DevNet Sandbox", "Code Exchange"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Automation Exchange provides various use cases for network automation.<br>\nListing data<br>\nAdding configurations<br>\nActivating policies across domains<br>\nActivating policies across users<br>\nActivating policies across devices<\/p><\/div>\n", "id": 37}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 10, "questionHtml": "<p><strong>10. What are two requirements when participating in the DevNet Learning Labs? (Choose two.) <\/strong><\/p>\n", "questionText": "10. What are two requirements when participating in the DevNet Learning Labs? (Choose two.)", "choices": ["The user must successfully log in with a DevNet account.", "The user must have successfully passed the 200-901 DEVASC exam.", "The user must have an active internet connection.", "The user must have purchased the DevNet Learning Labs activation license.", "The user must install a developer environment on a local computer."], "correct": [0, 2], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> When starting the DevNet Learning Labs for the first time there are only two requirements:<br>\nYou must have an internet connection.<br>\nYou must have a DevNet account.<\/p><\/div>\n", "id": 38}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 11, "questionHtml": "<p><strong>11. What are three major areas that comprise DevNet? (Choose three.) <\/strong><\/p>\n", "questionText": "11. What are three major areas that comprise DevNet? (Choose three.)", "choices": ["on-line training site for various technology vendors", "interactive and collaborative developer community", "integrated community forums", "automation and programmability standards development area", "providing support for website creation and maintenance", "coordinated developer tools"], "correct": [1, 2, 5], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> DevNet is a fully-integrated developer program consisting of a website, an interactive developer community, coordinated developer tools, integrated community forums, and sandboxes.<\/p><\/div>\n", "id": 39}, {"module": "Module 2", "section": "Module 2 Exam", "source": "DevNet Associate (Version 1.0) - Module 2 Exam Answers.html", "sourceNumber": 12, "questionHtml": "<p><strong>12. What resources are available in the Cisco DevNet Code Exchange? <\/strong><\/p>", "questionText": "12. What resources are available in the Cisco DevNet Code Exchange?", "choices": ["a repository of sample code written by other developers", "production-like development and code testing environments", "support for developer-related issues using forums and live chats", "self-paced tutorials that cover a wide range of automation and integration topics"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><b>Explanation:<\/b> The Cisco DevNet Code Exchange provides a repository of sample code to be shared with other developers.<\/p><\/div>\n\t\t\t\t\t\t\t\t\t\t", "id": 40}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 1, "questionHtml": "<p><strong>1. What type of learner should take the DevNet Associate course?<\/strong><\/p>\n", "questionText": "1. What type of learner should take the DevNet Associate course?", "choices": ["anyone that does not like working in teams and is a software developer", "anyone interested in network automation and programmability", "only new network engineers", "only new software developers"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The DevNet Associate course is designed for anyone interested in networking, software development, or the combination of the two.<\/p><\/div>\n", "id": 41}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 2, "questionHtml": "<p><strong>2. What is contained within a DevNet Sandbox?<\/strong><\/p>\n", "questionText": "2. What is contained within a DevNet Sandbox?", "choices": ["a collection of self-paced tutorials using REST APIs", "instructor-led videos focusing on hands-on exercises", "a collection of Cisco developer API documentation", "a preconfigured environment already installed with Cisco platforms"], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Cisco DevNet Sandbox is a preconfigured environment already installed with Cisco platforms. A development environment can also be set up on a local computer to continue practice and reinforce learning.<\/p><\/div>\n", "id": 42}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 3, "questionHtml": "<p><strong>3. Which two DevNet resources are available online? (Choose two.)<\/strong><\/p>\n", "questionText": "3. Which two DevNet resources are available online? (Choose two.)", "choices": ["Python Exchange", "API Tokens", "DevNet Zone", "Automation Exchange", "Code Exchange"], "correct": [3, 4], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> There are two DevNet resources that are available online 24 hours a day, 7 days a week: Code Exchange and Automation Exchange.<\/p><\/div>\n", "id": 43}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 4, "questionHtml": "<p><strong>4. Which DevNet resource would a developer use if the developer is using a Cisco API and needs help understanding the error message received?<\/strong><\/p>", "questionText": "4. Which DevNet resource would a developer use if the developer is using a Cisco API and needs help understanding the error message received?", "choices": ["DevNet Support", "DevNet Learning Labs", "Code Exchange", "DevNet Sandbox"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> DevNet support provides multiple ways to support developers using Cisco APIs. There are community forums, knowledge bases, Webex Teams, and case-based tickets for a fee.<\/p><\/div>\n", "id": 44}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 5, "questionHtml": "<p><strong>5. What is Cisco DevNet?<\/strong><\/p>\n", "questionText": "5. What is Cisco DevNet?", "choices": ["a Cisco-proprietary virtual network", "a way to create networks using software alone", "a developer program", "a vendor-neutral type of virtual networking"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> Cisco DevNet is a developer program that includes online resources, an interactive developer community, developer tools, discussion forums, learning labs, and a production-like development and testing sandbox environment.<\/p><\/div>\n", "id": 45}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 6, "questionHtml": "<p><strong>6. What is required in order to ensure that clients are able to talk to applications that are outside a local system?<\/strong><\/p>\n", "questionText": "6. What is required in order to ensure that clients are able to talk to applications that are outside a local system?", "choices": ["an application", "a network", "an API", "a script"], "correct": [1], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> Without a network, clients are unable to talk to applications that are outside the local system.<\/p><\/div>\n", "id": 46}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 7, "questionHtml": "<p><strong>7. What is the purpose of the Cisco DevNet Learning Labs?<\/strong><\/p>\n", "questionText": "7. What is the purpose of the Cisco DevNet Learning Labs?", "choices": ["They allow participants to add their own labs as long as the labs relate to any type of coding.", "They allow participants to add their own Python labs.", "They provide self-paced tutorials including coding.", "They provide a space for game development, interaction, and learning based on coding."], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Cisco DevNet Learning Labs provide tutorials over a wide range of topics including programming, engineering technologies, APIs, and model-driven programmability.<\/p><\/div>\n", "id": 47}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 8, "questionHtml": "<p><strong>8. What is a requirement when creating a Cisco DevNet account for accessing educational resources, such as Learning Labs and the DevNet Sandbox?<\/strong><\/p>", "questionText": "8. What is a requirement when creating a Cisco DevNet account for accessing educational resources, such as Learning Labs and the DevNet Sandbox?", "choices": ["The account holder must share personally created code before access is allowed.", "The account must contain a purchased license.", "The account must be registered using a Cisco email address.", "The account must be created using an existing online identity or via a new Cisco account."], "correct": [3], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Cisco DevNet site provides free access to additional educational resources, such as Learning Labs and the DevNet Sandbox after a user has created a DevNet account. A DevNet account can be created using an existing online identity or by creating a new Cisco account for DevNet membership.<\/p><\/div>\n", "id": 48}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 9, "questionHtml": "<p><strong>9. Which DevNet event is provided by Cisco partners and Cisco offices?<\/strong><\/p>\n", "questionText": "9. Which DevNet event is provided by Cisco partners and Cisco offices?", "choices": ["DevNet Express", "DevNet Learn In", "DevNet Hackathon", "DevNet Codearama"], "correct": [0], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> DevNet Express events are organized and offered by Cisco partners and Cisco local offices.<\/p><\/div>\n", "id": 49}, {"module": "Module 2", "section": "2.3.2 Developer Environment Quiz", "source": "2.3.2 Module 2_ The DevNet Developer Environment Quiz (Answers).html", "sourceNumber": 10, "questionHtml": "<p><strong>10. Which website provides the entry point for Cisco DevNet?<\/strong><\/p>\n", "questionText": "10. Which website provides the entry point for Cisco DevNet?", "choices": ["devnet.com", "cisco.com", "developer.cisco.com", "talosintelligence.com"], "correct": [2], "explanation": "<div class=\"message_box success\"><p><strong>Explanation:<\/strong> The Cisco DevNet website of developer.cisco.com is the central resource for all the Cisco developer tools and documentation.<\/p><\/div>\n\t\t\t\t\t\t\t\t\t\t", "id": 50}];

True) </code>``</p><p>What is the data type reported by Python?</p>","questionText":"A student is learning Python in the interactive interpreter mode. The student issues the command:\n```  \n>>> type(True)  \n```\n\nWhat is the data type reported by Python?","choices":["integer","float","Boolean","string"],"correct":[2],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":61},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":12,"questionHtml":"<p>A system administrator attempts to determine what is causing a computer to perform slower than normal. The administrator issues the <code>ps</code> command. What is displayed by this command?</p>","questionText":"A system administrator attempts to determine what is causing a computer to perform slower than normal. The administrator issues the `ps` command. What is displayed by this command?","choices":["active processes using CPU time","current NIC status","current HDD usage","current RAM usage"],"correct":[0],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":62},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":13,"questionHtml":"<p>What is displayed after the following code is entered into a Python interpreter? ``<code> addition \\= 22 +10 print(addition) </code>``</p>","questionText":"What is displayed after the following code is entered into a Python interpreter?\n```  \naddition \\= 22 +10  \nprint(addition)  \n```","choices":["32","nothing ( because the print command is wrong)","(syntaxerror)-…as there should not be a space between the numerical values","[22]+[10]"],"correct":[0],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":63},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":14,"questionHtml":"<p>A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a . What is the result of this command?</p>","questionText":"A network engineer needs to review the status of all network interfaces of a server running a Linux operating system. The engineer enters the command ifconfig -a . What is the result of this command?","choices":["The host routing table will be displayed.","The ARP table of the computer will be displayed.","Both active and inactive interfaces will display information.","All active interfaces will display information."],"correct":[2],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":64},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":15,"questionHtml":"<p>A student is learning Python and is reviewing a Python script as follows: ``<code> aclNum \\= int(input(&quot;What is the IPv4 ACL number? &quot;)) if aclNum &gt;= 1 and aclNum \\&lt;= 99: print(&quot;This is a standard IPv4 ACL.&quot;) elif aclNum &gt;=100 and aclNum \\&lt;= 199: print(&quot;This is an extended IPv4 ACL.&quot;) else: print(&quot;This is not a standard or extended IPv4 ACL.&quot;) </code>``</p><p>Under which condition will the elif statement be evaluated?</p>","questionText":"A student is learning Python and is reviewing a Python script as follows:\n```  \naclNum \\= int(input(\"What is the IPv4 ACL number? \"))  \nif aclNum >= 1 and aclNum \\<= 99:  \n     print(\"This is a standard IPv4 ACL.\")  \nelif aclNum >=100 and aclNum \\<= 199:  \n     print(\"This is an extended IPv4 ACL.\")  \nelse:  \n     print(\"This is not a standard or extended IPv4 ACL.\")  \n```\n\nUnder which condition will the elif statement be evaluated?","choices":["when the input is a string","when the first print statement fails","when the input is a float number","when the if statement is false"],"correct":[3],"explanation":"<p>Answer key imported from <code>MT.md</code>.</p>","id":65},{"module":"Midterms","section":"Midterms","source":"MT.md","sourceNumber":16,"questionHtml":"<p>A student is learning Python in the interactive interpreter
